# Cloud Build configuration for InSite Survey Backend
# This file configures automatic build and deployment to Cloud Run

steps:
  # Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/insite-backend:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/insite-backend:latest'
      - '.'

  # Push the Docker image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/insite-backend:$COMMIT_SHA'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/insite-backend:latest'

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'insite-backend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/insite-backend:$COMMIT_SHA'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--set-env-vars'
      - 'MONGODB_URI=${_MONGODB_URI},MONGODB_DB=${_MONGODB_DB},JWT_SECRET_KEY=${_JWT_SECRET_KEY},BASE_URL=${_BASE_URL},SMTP_HOST=${_SMTP_HOST},SMTP_PORT=${_SMTP_PORT},SMTP_USER=${_SMTP_USER},SMTP_PASSWORD=${_SMTP_PASSWORD},SMTP_FROM_EMAIL=${_SMTP_FROM_EMAIL},SMTP_FROM_NAME=${_SMTP_FROM_NAME}'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '10'

# Substitution variables (set these in Cloud Build trigger or Secret Manager)
substitutions:
  _REGION: 'us-central1'
  _MONGODB_URI: ''
  _MONGODB_DB: 'insite_survey'
  _JWT_SECRET_KEY: ''
  _BASE_URL: ''
  _SMTP_HOST: 'smtp.gmail.com'
  _SMTP_PORT: '587'
  _SMTP_USER: ''
  _SMTP_PASSWORD: ''
  _SMTP_FROM_EMAIL: ''
  _SMTP_FROM_NAME: 'InSite Survey'

# Build options
options:
  logging: CLOUD_LOGGING_ONLY

# Images to store in Container Registry
images:
  - 'gcr.io/$PROJECT_ID/insite-backend:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/insite-backend:latest'

# Build timeout
timeout: '1200s'
